name: test
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack --dry-run
      - run: dotnet build standalone/ClaudeZhStandalone.csproj -c Release -p:EnableDefaultItems=true

